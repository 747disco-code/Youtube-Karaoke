<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #videoContainer {
      flex: 1;
      display:  flex;
      justify-content:  center;
      align-items:  center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #controls {
      background: rgba(0,0,0,0.8);
      padding: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #667eea;
      color: white;
      transition: all 0.3s;
    }

    button:hover {
      background: #764ba2;
      transform: scale(1.05);
    }

    #title {
      text-align: center;
      padding: 20px;
      background: rgba(102, 126, 234, 0.2);
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="title">🎤 Karaoke Mode</div>
  
  <div id="videoContainer">
    <video id="videoPlayer" controls></video>
  </div>

  <div id="controls">
    <button onclick="document.getElementById('videoPlayer').currentTime -= 10">⏪ -10s</button>
    <button onclick="togglePlay()">▶️ Play/Pause</button>
    <button onclick="document.getElementById('videoPlayer').currentTime += 10">⏩ +10s</button>
    <button onclick="toggleFullscreen()">🖥️ Fullscreen</button>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    
    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    function toggleFullscreen() {
      if (video.requestFullscreen) {
        video.requestFullscreen();
      }
    }

    // Carica video dall'URL passato
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('video');
    if (videoUrl) {
      video.src = decodeURIComponent(videoUrl);
    }
  </script>
</body>
</html>
